[package]
name = "catena-ratatui"
version = "0.1.0"
description = "ratatui widgets for catena's interactive terminal graphs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false

[lints]
workspace = true

[features]
# `input::from_crossterm` (plan §10.1).
crossterm = ["dep:crossterm"]

[dependencies]
catena.workspace = true
crossterm = { workspace = true, optional = true }
ratatui-core.workspace = true

[dev-dependencies]
catena-testkit.workspace = true
# `input`'s unit tests build without the feature, as the push gate tests (`lib.rs`).
crossterm.workspace = true
insta.workspace = true
proptest.workspace = true

[[test]]
name = "catena_ratatui"
path = "tests/catena_ratatui/main.rs"
