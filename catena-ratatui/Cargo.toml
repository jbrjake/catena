[package]
name = "catena-ratatui"
version = "0.1.0"
description = "ratatui widgets for catena's interactive terminal graphs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false

[lints]
workspace = true

[features]
# `input::from_crossterm` (plan §10.1).
crossterm = ["dep:crossterm"]
# The `Minimap` and `Legend` widgets (plan §3).
widget-extras = []
# The `catena-demo` bin (plan §19 M3): a crossterm terminal, the testkit's fixtures, and the
# extras it shows.
demo = ["crossterm", "widget-extras", "dep:catena-testkit", "dep:ratatui-crossterm"]

[dependencies]
catena.workspace = true
# The demo's fixtures. A version, unlike the dev-dependency's path alone, because a published
# optional dependency needs one: catena-testkit publishes before this crate.
catena-testkit = { path = "../catena-testkit", version = "0.1.0", optional = true }
crossterm = { workspace = true, optional = true }
ratatui-core.workspace = true
ratatui-crossterm = { workspace = true, optional = true }

[dev-dependencies]
catena-testkit.workspace = true
# `input`'s unit tests build without the feature, as the push gate tests (`lib.rs`).
crossterm.workspace = true
insta.workspace = true
proptest.workspace = true

[[test]]
name = "catena_ratatui"
path = "tests/catena_ratatui/main.rs"

[[bin]]
name = "catena-demo"
path = "src/bin/catena-demo/main.rs"
required-features = ["demo"]
