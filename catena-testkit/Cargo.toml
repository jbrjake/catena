[package]
name = "catena-testkit"
version = "0.1.0"
description = "Test support for catena: fixtures, raster asserts, visual snapshots, determinism checks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false

[lints]
workspace = true

[dependencies]
catena.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "catena_testkit"
path = "tests/catena_testkit/main.rs"

# The cross-run determinism test's subject (plan §3, §16.5): a bin, not an example, because
# cargo gives tests a path to a package's bins (`CARGO_BIN_EXE_<name>`) and to nothing else.
[[bin]]
name = "catena-render-hash"
path = "src/bin/catena-render-hash.rs"
