[workspace]
members = ["catena", "catena-ratatui", "catena-testkit", "xtask"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/jbrjake/catena"

[workspace.dependencies]
catena = { path = "catena", version = "0.1.0" }
# Path only, no version: cargo strips it from `catena`'s published dev-dependencies, which is
# what lets `catena` publish before the testkit that depends on it (plan §3).
catena-testkit = { path = "catena-testkit" }
libm = "0.2"
# Dev-only. The fork and timeout features would pull rusty-fork and tempfile for nothing.
proptest = { version = "1.11", default-features = false, features = ["std"] }
ratatui-core = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only `width()`; the default `cjk` feature adds ambiguous-width tables catena does not use.
unicode-width = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
